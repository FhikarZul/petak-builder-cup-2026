<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Petak product flow</title>
  <desc id="description">The mobile app sends messages and photos to the private Petak API on Cloud Run. A separate Cloud Run execution service calls Gemini through Vertex AI. The app gets results through API reads and events.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1l10 5-10 5" fill="none" stroke="#2A4A7B" stroke-width="2"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F2E7"/>
  <rect x="64" y="64" width="1472" height="772" fill="#FDFBF4" stroke="#20242E" stroke-width="2"/>
  <rect x="64" y="64" width="1472" height="14" fill="#2A4A7B"/>
  <text x="112" y="164" fill="#20242E" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="52" font-weight="600">From capture to a useful record</text>
  <text x="112" y="214" fill="#20242E" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="23">The client sends a message or photo; the backend handles AI work and delivers the result.</text>
  <rect x="419" y="262" width="780" height="365" fill="#F0EADC" stroke="#DED8CB" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="449" y="302" fill="#20242E" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="600">PRIVATE PETAK SERVICES</text>
  <g font-family="Plus Jakarta Sans, Arial, sans-serif" fill="#20242E">
    <rect x="112" y="330" width="265" height="228" fill="#DFE8DC" stroke="#20242E" stroke-width="2"/>
    <text x="136" y="391" font-size="31" font-weight="600">Mobile app</text>
    <text x="136" y="438" font-size="20">Message + photo</text>
    <text x="136" y="474" font-size="20">Supabase sign-in</text>
    <text x="136" y="526" font-size="17">Public client source</text>
    <rect x="455" y="330" width="320" height="228" fill="#FDFBF4" stroke="#20242E" stroke-width="2"/>
    <text x="479" y="391" font-size="31" font-weight="600">Petak API</text>
    <text x="479" y="438" font-size="20">Cloud Run · /v1</text>
    <text x="479" y="474" font-size="20">Reads, writes, events</text>
    <rect x="835" y="330" width="330" height="228" fill="#FDFBF4" stroke="#20242E" stroke-width="2"/>
    <text x="859" y="391" font-size="30" font-weight="600">Execution service</text>
    <text x="859" y="438" font-size="20">Cloud Run</text>
    <text x="859" y="474" font-size="20">Backend-side AI work</text>
    <rect x="1225" y="330" width="263" height="228" fill="#EAE0DF" stroke="#20242E" stroke-width="2"/>
    <text x="1249" y="391" font-size="30" font-weight="600">Vertex AI</text>
    <text x="1249" y="438" font-size="20">Gemini inference</text>
    <text x="1249" y="526" font-size="17">Google Cloud</text>
  </g>
  <g stroke="#2A4A7B" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M380 444h62"/>
    <path d="M778 444h44"/>
    <path d="M1168 444h44"/>
    <path d="M610 576v88H246v-88"/>
  </g>
  <text x="470" y="693" fill="#2A4A7B" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="21" font-weight="600">Results return through API reads and events</text>
  <text x="112" y="782" fill="#20242E" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18">The standalone Vertex AI example in this repository is separate from the product flow.</text>
  <text x="1488" y="782" fill="#2A4A7B" text-anchor="end" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="600">petak.app</text>
</svg>
